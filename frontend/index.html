<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Biblioteca</title>
  </head>
  <body>
    <div class="container mt-5">
        <h1 class="fw-bold text-primary mb-5 text-center">Gestión de Biblioteca </h1>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card p-4 shadow border-0" style="border-radius: 10px;">
                    <h4 class="mb-3 fw-bold text-dark" id="formTitle">Registrar Libro</h4>
                    <form id="bookForm">
                        <input type="hidden" id="bookId"> <div class="mb-3">
                            <label class="form-label">Título</label>
                            <input type="text" id="titulo" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Autor</label>
                            <input type="text" id="autor" class="form-control" required>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Año</label>
                                <input type="number" id="anio" class="form-control" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Categoría</label>
                                <input type="text" id="categoria" class="form-control" required>
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-success fw-bold">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card p-4 shadow border-0" style="border-radius: 10px;">
                    <h4 class="mb-3">Lista de Libros</h4>
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-primary text-white">
                                <tr>
                                    <th>Título</th>
                                    <th>Autor</th>
                                    <th>Año</th>
                                    <th>Categoría</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tablaLibros">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
